    <strong>Money Ores</strong>
	<img src="../../img/wiki/iaam/money_ores.png" width="15%" class="enlarge"><br>
	New ore appearing in the overworlds, at heights from -64 to 16. This ore is mined with at least a diamond pickaxe. This ore drops one 1-dollar bill, and if you have the Fortune enchantment, the number increases to 4 at a time.
	<br><br><br>
	<strong>Stacks of Bills</strong>
	<img src="../../img/wiki/iaam/stacks.png" width="35%" class="enlarge"><br>
	Storage blocks for dollar bills.<br><br>
	<img class="locked" src="../../img/wiki/iaam/stack_of_1s.png" width="35%"><br>
	*Screenshot shows the crafting of a stack of 1-dollar bills, but other stacks of bills can be crafted in the same way.<br>
	Craft

	<h2 id="iaam-items">Items</h2><br>
    <strong>Bills</strong>
	<img src="../../img/wiki/iaam/dollar_bills.png" width="35%" class="enlarge"><br>
	The main feature of this mod. Obtained in various ways, from crafting to ore.<br><br>
	<img class="locked" src="../../img/wiki/iaam/one_dollar_bill.png" width="35%"><br>
	*Сraft 1-dollar bill.<br>
	<img class="locked" src="../../img/wiki/iaam/one_dollar_bill_2.png" width="35%"><br>
	*Money ore can be smelted in a furnace or in a blast furnace.<br>
	<img class="locked" src="../../img/wiki/iaam/one_dollar_bill_3.png" width="35%"><br>
	*Conversion of a stack of bills into bills.<br>
	<div><img class="locked" src="../../img/wiki/iaam/one_dollar_to_five_dollar.png" width="35%"><img class="locked" src="../../img/wiki/iaam/five_dollar_to_one_dollar.png" width="35%"></div><br>
	*Conversion of bills in a craft grid.<br>
	Crafts
	<br><br><br>
    <strong>Dusts</strong>
	<img src="../../img/wiki/iaam/dusts.png" width="25%" class="enlarge"><br>
	The mod adds 3 types of dust that are used to make ingredients for armor and tools.<br><br>
	<div><img class="locked" src="../../img/wiki/iaam/familiarly_colored_dust.png" width="35%"><img class="locked" src="../../img/wiki/iaam/black_dust.png" width="35%"></div><br>
	<img class="locked" src="../../img/wiki/iaam/entropy_alloy_dust.png" width="35%"><br>
	*Creation takes place in the anvil. Level 4 exp is required for creation.<br>
	Crafts
	<br><br><br>
    <strong>Entropy Armor</strong>
	<img src="../../img/wiki/iaam/entropy_armor.png" width="25%" class="enlarge"><br>
	A new armor set made from Entropy Alloy and other ingredients.<br>
	Armor: 12|32|24|12<br>
	Armor toughness: 12<br>
	Enchantability: 30<br>
	It also does not burn in fire or lava, like the Netherite Armor set. Repair at the anvil using an Entropy Alloy Ingot.<br><br>
	<div><img class="locked" src="../../img/wiki/iaam/entropy_helmet.png" width="35%"><img class="locked" src="../../img/wiki/iaam/entropy_chestplate.png" width="35%"></div><br>
	<div><img class="locked" src="../../img/wiki/iaam/entropy_leggings.png" width="35%"><img class="locked" src="../../img/wiki/iaam/entropy_boots.png" width="35%"></div><br>
	Crafts
	<br><br><br>
    <strong>Entropy Tools</strong>
	<img src="../../img/wiki/iaam/entropy_tools.png" width="40%" class="enlarge"><br>
	A new tools set made from Entropy Alloy and other ingredients.<br>
	Mining efficiency: 48<br>
	Mining level: 4<br>
	Attack damage: 64|64|48|12|13|14<br>
	Attack speed‌: 1<br>
	Durability: 4062<br>
	Enchantability: 30<br>
	It also does not burn in fire or lava, like the Netherite Tools set. Repair at the anvil using an Entropy Alloy Ingot.<br><br>
	<div><img class="locked" src="../../img/wiki/iaam/entropy_aiot.png" width="35%"><img class="locked" src="../../img/wiki/iaam/entropy_sword.png" width="35%"></div><br>
	<div><img class="locked" src="../../img/wiki/iaam/entropy_axe.png" width="35%"><img class="locked" src="../../img/wiki/iaam/entropy_pickaxe.png" width="35%"></div><br>
	<div><img class="locked" src="../../img/wiki/iaam/entropy_shovel.png" width="35%"><img class="locked" src="../../img/wiki/iaam/entropy_hoe.png" width="35%"></div><br>
